name: Update cask.json
on:
  push:
    paths:
      - .github/workflows/scheduled.yml
      - taps
      - generate-cask.rb
  schedule:
    # Every 60 minutes
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_BOOTSNAP: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  update:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        # Homebrew 7.0.0 removed the "master" branch; upstream recommends
        # pinning a release or full SHA.
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          core: false
          cask: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true

      - name: Generate cask.json
        run: |
          # Fail on the first error instead of carrying on and publishing an
          # empty result.
          set -euo pipefail

          # Log the Homebrew version so a loader change is visible in the log.
          brew --version

          # Clean up
          rm -rf _data/cask
          mkdir -p _data/cask

          # Import taps
          . taps

          # Register all the taps
          for i in "${TAPS[@]}"; do
            brew tap --force "${i}"
          done

          # Homebrew 6.0.0+ refuses to load formulae/casks from non-official
          # taps unless the tap (or the individual item) has been trusted.
          # Without this, generate-cask.rb silently skips every third-party
          # cask. Official taps are always trusted, so only trust the rest.
          # See https://docs.brew.sh/Tap-Trust
          for i in "${TAPS[@]}"; do
            case "$i" in
              homebrew/*) ;;
              *) brew trust --tap "${i}" ;;
            esac
          done

          brew update

          # Generate cask json files. generate-cask.rb exits non-zero when a
          # tap has casks but none of them could be generated, which is how a
          # broken cask loader (Homebrew 7.0.13+ rejecting paths) used to slip
          # through as a successful, empty run.
          for i in "${TAPS[@]}"; do
            before=$(find _data/cask -name '*.json' | wc -l)
            brew ruby ./generate-cask.rb "${i}"
            after=$(find _data/cask -name '*.json' | wc -l)
            echo "Generated $((after - before)) casks for ${i}"
          done

          # Merge cask json files to a single json file. `jq -s` is used
          # directly (not inside `echo "$(...)"`) so that a jq failure such as
          # an unmatched glob actually fails the step.
          if ! compgen -G "_data/cask/*.json" > /dev/null; then
            echo "::error::No cask data was generated at all"
            exit 1
          fi
          jq -s '.' _data/cask/*.json > raw.json

      - name: Simplify cask.json
        run: |
          set -euo pipefail
          jq -c '[map(del(.tap_git_head,.tap,.installed_time,.installed,.ruby_source_path,.ruby_source_checksum))[]]' raw.json > cask.json
          rm raw.json

      - name: Validate JSON
        run: |
          set -euo pipefail
          jq empty cask.json
          count=$(jq 'length' cask.json 2>/dev/null || echo 0)
          echo "cask.json contains ${count} casks"
          # An empty cask.json breaks every consumer of this repository.
          if [ "${count}" -lt 1 ]; then
            echo "::error::cask.json is empty; refusing to publish it"
            exit 1
          fi

      - name: Push changes
        # Only commit generated output on the default branch. On pull request
        # branches the committed cask.json collides with the one regenerated
        # on master, which shows up as a spurious merge conflict.
        if: github.ref == 'refs/heads/master'
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: 'cask.json'
          message: 'chore: Update api output'
          default_author: github_actions

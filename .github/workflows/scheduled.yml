name: Update cask.json
on:
  push:
    paths:
      - .github/workflows/scheduled.yml
      - taps
      - generate-cask.rb
  schedule:
    # Every 60 minutes
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_BOOTSNAP: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  update:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        # Homebrew 7.0.0 removed the "master" branch; upstream recommends
        # pinning a release or full SHA.
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          core: false
          cask: false

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true

      - name: Generate cask.json
        run: |
          # Clean up
          rm -rf _data/cask
          mkdir -p _data/cask

          # Import taps
          . taps

          # Register all the taps
          for i in "${TAPS[@]}"; do
            brew tap --force ${i}
          done

          brew update

          # Generate cask json files
          for i in "${TAPS[@]}"; do
            brew ruby ./generate-cask.rb ${i}
          done

          # Merge cask json files to a single json file
          echo "`jq -n '[inputs]' _data/cask/*.json`" > raw.json

      - name: Simplify cask.json
        run: echo "`jq -c '[map(del(.tap_git_head,.tap,.installed_time,.installed,.ruby_source_path,.ruby_source_checksum))[]]' raw.json`" > cask.json && rm raw.json

      - name: Validate JSON
        run: jq empty cask.json

      - name: Push changes
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          add: 'cask.json'
          message: 'chore: Update api output'
          default_author: github_actions

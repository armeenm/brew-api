name: Update cask.json
on:
  push:
    paths:
      - .github/workflows/scheduled.yml
      - taps
      - generate-cask.rb
  schedule:
    # Every 60 minutes
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_BOOTSNAP: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  update:
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        # Pinned to the 2026.10.12.1 CalVer release: Homebrew removed the
        # "master" branch in 7.0.0 and recommends pinning a release or SHA.
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c
        with:
          core: false
          cask: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate cask.json
        run: |
          # Clean up
          rm -rf _data/cask
          mkdir -p _data/cask

          # Import taps
          . taps

          # Register all the taps
          for i in "${TAPS[@]}"; do
            brew tap --force ${i}
          done

          brew update

          # Generate cask json files
          for i in "${TAPS[@]}"; do
            brew ruby ./generate-cask.rb ${i}
          done

          # Merge cask json files to a single json file
          echo "`jq -n '[inputs]' _data/cask/*.json`" > raw.json

      - name: Simplify cask.json
        run: echo "`jq -c '[map(del(.tap_git_head,.tap,.installed_time,.installed,.ruby_source_path,.ruby_source_checksum))[]]' raw.json`" > cask.json && rm raw.json

      - name: Validate JSON
        run: jq empty cask.json

      - name: Push changes
        uses: EndBug/add-and-commit@v9
        with:
          add: 'cask.json'
          message: 'chore: Update api output'
          default_author: github_actions
